name: Atualizar tarifas ANEEL

# Abre um PR com src/data/tarifas.json atualizado quando a ANEEL publica
# novos reajustes, para manter os dados versionados no repositório.
on:
  schedule:
    - cron: '43 8 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tarifas:atualizar
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: dados/tarifas-aneel
          commit-message: 'chore(dados): atualiza tarifas ANEEL'
          title: 'Atualiza tarifas ANEEL'
          body: Tarifas residenciais B1 (TE + TUSD) vigentes, obtidas dos dados abertos da ANEEL.
          add-paths: src/data/tarifas.json
